[project]
name = "income-statement"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
src = [".", "tests"]

[tool.ruff.lint]
# E, W: style. F: mistakes such as unused names. I: import order. B: likely bugs. UP: outdated syntax.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
files = ["checks.py", "ledger.py", "statement.py", "app.py"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
